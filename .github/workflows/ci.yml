name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      # uv runs dmgbuild for the styled .dmg window (scripts/dmg-settings.py)
      - uses: astral-sh/setup-uv@v6
      - name: Test
        run: swift test
      - name: Build app
        run: VERSION=0.0.0-ci UNIVERSAL=1 scripts/build-app.sh
      - name: Check fake camera script
        run: python3 -m py_compile tools/fake_camera.py
