name: Release

# Push a tag like v1.0.0 to build, sign (if configured) and publish a GitHub Release:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Without secrets the app is ad-hoc signed: it works, but macOS asks for confirmation on
# first launch. With an Apple Developer ID, add these repository secrets to get a signed,
# notarized app that opens without warnings:
#   MACOS_CERTIFICATE_P12      base64 of the "Developer ID Application" .p12 export
#   MACOS_CERTIFICATE_PASSWORD password of that .p12
#   MACOS_SIGN_IDENTITY        e.g. "Developer ID Application: Your Name (TEAMID)"
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD (app-specific password)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        run: swift test

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build
        env:
          SIGN_IDENTITY: ${{ env.HAS_CERT == 'true' && secrets.MACOS_SIGN_IDENTITY || '-' }}
        run: VERSION="${GITHUB_REF_NAME#v}" UNIVERSAL=1 scripts/build-app.sh

      - name: Notarize
        if: env.HAS_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          DMG="build/DomeScanner-${GITHUB_REF_NAME#v}.dmg"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD" --wait
          xcrun stapler staple "$DMG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          shasum -a 256 build/DomeScanner-$VERSION.dmg build/DomeScanner-$VERSION.zip > build/SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            "build/DomeScanner-$VERSION.dmg" "build/DomeScanner-$VERSION.zip" build/SHA256SUMS.txt \
            --title "Dome Scanner $VERSION" --generate-notes
